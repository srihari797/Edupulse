services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edupulse-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  vision:
    build:
      context: ./vision
      dockerfile: Dockerfile
    container_name: edupulse-vision
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - VECTOR_STORE_PATH=/app/vision/vector_store/face_vectors.json
      - ATTENDANCE_DB_PATH=/app/vision/vector_store/attendance.db
    volumes:
      - vision-store:/app/vision/vector_store
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_VISION_API_BASE_URL: ${NEXT_PUBLIC_VISION_API_BASE_URL:-http://localhost:8001}
    container_name: edupulse-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
      vision:
        condition: service_healthy

volumes:
  vision-store:
    name: edupulse-vision-store
